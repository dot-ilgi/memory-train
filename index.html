<title>기억 열차</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen game — large pixel stage on top (full-bleed on phones), RPG-Maker window stack below. Single deep-navy night world by choice. */
:root{
  --ink:#03050e;
  --win-top:#141d52;
  --win-bot:#070b26;
  --frame:#c9d1f3;
  --gold:#f2c14e;
  --text:#eceefa;
  --muted:#8b94bf;
  --rose:#e86a5c;
  --paper:#0b1233;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-letter:"Gowun Batang","AppleMyungjo","Batang",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 20%,rgba(30,44,120,.35),transparent 65%)}
#app{position:relative;height:100%;box-sizing:border-box;max-width:920px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#stage{position:relative;width:min(100%,calc(66vh * 4 / 3));aspect-ratio:4/3;max-width:100%;flex:none;cursor:pointer}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--frame);border-radius:6px;box-sizing:border-box;box-shadow:0 0 0 3px #01020a,0 14px 40px rgba(0,0,0,.6);background:#000}
@media (max-width:600px){
  #app{padding-top:0;gap:12px}
  #stage{width:100vw;max-width:100vw;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  #cv{border-width:0 0 3px;border-radius:0;box-shadow:0 3px 0 #01020a}
  #cover,#titleCard{inset:0 0 3px!important;border-radius:0!important}
}
#sound{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));font:14px var(--f-display);color:var(--text);background:rgba(3,5,14,.7);border:2px solid var(--frame);border-radius:4px;padding:4px 8px;cursor:pointer}
#sound[aria-pressed="true"]{color:var(--gold)}
#cover{position:absolute;inset:3px;border-radius:3px;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
#cover.on{opacity:1}
#cover .ch{font:16px var(--f-display);color:var(--gold);letter-spacing:.2em}
#cover .sub{font:clamp(24px,6.5vw,36px) var(--f-display);color:var(--text)}
#titleCard{position:absolute;inset:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;pointer-events:none;background:linear-gradient(180deg,rgba(3,5,20,.2),rgba(3,5,20,.75))}
#titleCard h1{margin:0;font:clamp(44px,13vw,72px)/1 var(--f-display);color:var(--text);text-shadow:3px 3px 0 #01020a,0 0 22px rgba(242,193,78,.4);letter-spacing:.04em}
#titleCard p{margin:0;font:15px var(--f-body);color:var(--muted)}
#titleCard .ticket{font:13px var(--f-display);color:var(--gold);letter-spacing:.3em;margin-bottom:6px}
#ui{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;gap:10px;padding-top:12px;box-sizing:border-box}
.win{position:relative;background:linear-gradient(180deg,var(--win-top),var(--win-bot));border:3px solid var(--frame);border-radius:8px;box-shadow:0 0 0 3px #01020a,inset 0 0 0 2px rgba(1,2,10,.6);box-sizing:border-box}
#dialog{min-height:108px;padding:20px 18px 16px;cursor:pointer;font-size:17px;line-height:1.7}
#name{position:absolute;top:-16px;left:12px;font:15px var(--f-display);background:var(--win-bot);border:3px solid var(--frame);border-radius:6px;padding:2px 10px;color:var(--gold);box-shadow:0 0 0 2px #01020a}
#text{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;min-height:3.4em}
#next{position:absolute;right:14px;bottom:8px;color:var(--gold);animation:bob .8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#choices{padding:8px 6px;display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto;flex:0 1 auto}
.opt{display:block;width:100%;text-align:left;font:16px/1.4 var(--f-body);color:var(--text);background:transparent;border:0;border-radius:4px;padding:9px 12px 9px 30px;position:relative;cursor:pointer}
.opt::before{content:"▶";position:absolute;left:10px;top:9px;color:var(--gold);opacity:0;font-size:12px;line-height:22px}
.opt:hover,.opt:focus-visible{background:rgba(255,255,255,.08);outline:none}
.opt:hover::before,.opt:focus-visible::before{opacity:1;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
#inputWin{padding:12px;display:flex;gap:8px}
#inputWin input{flex:1;min-width:0;font:16px var(--f-body);color:var(--text);background:rgba(1,2,10,.6);border:2px solid var(--muted);border-radius:4px;padding:10px 12px}
#inputWin input:focus{outline:none;border-color:var(--gold)}
.btn{font:16px var(--f-display);color:#1a1405;background:var(--gold);border:0;border-radius:4px;padding:11px 16px;cursor:pointer;box-shadow:0 3px 0 #a87d1f}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a87d1f}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--frame);box-shadow:none}
.btn:focus-visible{outline:2px solid var(--frame);outline-offset:2px}

/* epilogue */
#epi{position:fixed;inset:0;z-index:15;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;transition:opacity 1.2s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;cursor:pointer}
#epi.on{opacity:1}
#epiFrame{position:relative;width:min(88vw,560px,calc(52vh * 4 / 3));aspect-ratio:4/3;max-width:100%;opacity:0;transition:opacity 1.4s}
#epiFrame.on{opacity:1}
#epiCv{width:100%;height:100%;display:block;image-rendering:pixelated;filter:grayscale(.55) sepia(.25) brightness(.75) contrast(1.05)}
#epiFrame::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#000 100%)}
#epiLine{min-height:3.6em;max-width:30em;text-align:center;font:clamp(17px,4.6vw,22px)/1.7 var(--f-letter);color:#e9e4d4;word-break:keep-all;opacity:0;transition:opacity 1.1s}
#epiLine.on{opacity:1}
#epiTitle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;transition:opacity 1.6s;pointer-events:none;text-align:center}
#epiTitle.on{opacity:1}
#epiTitle .k{font:14px var(--f-display);letter-spacing:.35em;color:var(--gold)}
#epiTitle .t{font:clamp(30px,9vw,48px) var(--f-display);color:var(--text)}
#epiSkip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:13px;color:#6d7398}

/* result */
#result{position:fixed;inset:0;background:var(--ink);overflow:auto;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#result .wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 44px;display:flex;flex-direction:column;gap:18px}
.sheet{padding:24px 20px 22px}
.label{font:13px var(--f-display);letter-spacing:.25em;color:var(--gold)}
.hero{display:flex;gap:16px;align-items:center;margin-top:12px}
.hero canvas{width:72px;height:96px;image-rendering:pixelated;flex:none;background:var(--paper);border:2px solid rgba(201,209,243,.35);border-radius:4px}
.hero .who{min-width:0}
.hero .nm{font:15px var(--f-body);color:var(--muted)}
.hero h2{margin:2px 0 0;font:clamp(26px,7.5vw,32px)/1.2 var(--f-display);text-wrap:balance;color:var(--text)}
.desc{margin:14px 0 0;font-size:15px;line-height:1.75;word-break:keep-all}
.stats{display:grid;gap:9px;margin-top:16px}
.stat{display:grid;grid-template-columns:4.2em 3.6em 1fr;align-items:center;gap:8px;font-size:15px}
.stat .lv{font:15px var(--f-display);color:var(--gold);font-variant-numeric:tabular-nums}
.bar{height:10px;background:rgba(1,2,10,.7);border:2px solid rgba(201,209,243,.45);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transform-origin:left;animation:fill 1.2s .6s both}
.bar.top i{background:var(--rose)}
@keyframes fill{from{transform:scaleX(0)}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h3{margin:0;font:20px var(--f-display);color:var(--text)}
.sec-h span{font:13px var(--f-display);color:var(--muted);letter-spacing:.1em}
.log{display:grid;margin-top:8px}
.entry{display:grid;grid-template-columns:3.4em 1fr;gap:12px;padding:16px 0;border-top:2px dashed rgba(201,209,243,.2)}
.entry:first-child{border-top:0}
.entry .no{font:14px var(--f-display);color:var(--gold);line-height:1.4}
.entry .no small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.entry .body{min-width:0}
.entry .place{font:16px var(--f-display);color:var(--text)}
.entry p{margin:6px 0 0;font-size:15px;line-height:1.8;word-break:keep-all}
.quote{margin-top:10px;padding:8px 12px;border-left:3px solid var(--gold);background:rgba(1,2,10,.45);font:16px/1.7 var(--f-letter);word-break:keep-all;overflow-wrap:anywhere}
.quote small{display:block;font:12px var(--f-display);color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
.letter{background:#f1ead7;color:#2a2438;border-radius:6px;padding:26px 22px 22px;font:16px/1.95 var(--f-letter);box-shadow:0 0 0 3px #01020a,0 14px 30px rgba(0,0,0,.5);background-image:repeating-linear-gradient(180deg,transparent 0 30px,rgba(42,36,56,.08) 30px 31px)}
.letter .to{font-size:17px;margin-bottom:10px}
.letter p{margin:0 0 12px;word-break:keep-all;overflow-wrap:anywhere}
.letter .from{text-align:right;margin-top:16px;color:#5a4e6e}
.stamp{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font:13px var(--f-display);color:var(--muted);letter-spacing:.1em}
.stamp b{color:var(--rose);border:2px solid var(--rose);border-radius:50%;padding:9px 6px;transform:rotate(-12deg);font-weight:400}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:130px}
.hint{text-align:center;font-size:13px;color:var(--muted);margin:0}
#cardView{position:fixed;inset:0;z-index:30;background:rgba(1,2,10,.94);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cv-in{max-width:420px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;display:flex;flex-direction:column;gap:14px}
#cardImg{display:block;width:auto;max-width:100%;max-height:68vh;margin:0 auto;border-radius:8px;box-shadow:0 0 0 3px #c9d1f3;-webkit-touch-callout:default}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){#next,.opt::before,.rise,.bar i{animation:none}#cover,#epi,#epiLine,#epiFrame,#epiTitle{transition:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv" width="160" height="120" aria-label="게임 화면"></canvas>
    <div id="titleCard">
      <div class="ticket">ONE-WAY · 인생선</div>
      <h1>기억 열차</h1>
      <p>지나온 시간을 한 정거장씩 다시 걷는 게임</p>
    </div>
    <div id="cover"><div class="ch" id="coverCh"></div><div class="sub" id="coverSub"></div></div>
    <button id="sound" type="button" aria-pressed="false">♪ 소리 끔</button>
  </div>
  <div id="ui">
    <div class="win" id="dialog" role="button" tabindex="0" aria-live="polite">
      <div id="name" hidden></div>
      <div id="text"></div>
      <div id="next" hidden>▼</div>
    </div>
    <div class="win" id="choices" hidden></div>
    <div class="win" id="inputWin" hidden>
      <input id="answer" type="text" maxlength="40" autocomplete="off">
      <button class="btn" id="ok" type="button">확인</button>
    </div>
  </div>
</div>

<div id="epi" hidden>
  <div id="epiFrame"><canvas id="epiCv" width="160" height="120" aria-hidden="true"></canvas></div>
  <div id="epiLine" aria-live="polite"></div>
  <div id="epiTitle"><div class="k" id="epiK">기억역 발행</div><div class="t" id="epiName"></div></div>
  <div id="epiSkip">화면을 누르면 다음 장면으로 넘어가요</div>
</div>

<div id="cardView" hidden>
  <div class="cv-in">
    <img id="cardImg" alt="인생 기록장 스토리 이미지">
    <p class="hint">이미지를 꾹 눌러 사진에 저장하고, 인스타 스토리에 올려 보세요.</p>
    <div class="actions">
      <button class="btn" id="shareCard" type="button">공유하기</button>
      <button class="btn ghost" id="closeCard" type="button">닫기</button>
    </div>
    <p class="hint" id="cardHint"></p>
  </div>
</div>

<div id="result" hidden>
  <div class="wrap" id="resWrap"></div>
</div>

<script>
(()=>{
const W=160,H=120,FEET=103;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- drawing helpers ---------- */
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function circ(cx,cy,r,c){for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));rect(cx-w,cy+y,w*2+1,1,c)}}
function sky(cols,y0,y1){const h=(y1-y0)/cols.length;cols.forEach((c,i)=>rect(0,y0+i*h,W,Math.ceil(h)+1,c));
  cols.forEach((c,i)=>{if(!i)return;const y=Math.round(y0+i*h)-1;for(let x=(i%2);x<W;x+=2)rect(x,y,1,1,c)})}
function seeded(n,seed){let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;return Array.from({length:n},()=>[r(),r(),r()])}
const STAR=seeded(90,7),RAIN=seeded(80,11),WIN=seeded(40,23),FLY=seeded(10,31),DUST=seeded(14,5);
function stars(t,n,y1){for(let i=0;i<n;i++){const[a,b,c]=STAR[i];const on=Math.floor(t/350+c*9)%5;rect(a*W,b*y1,1,1,on===0?'#5a62a8':(c>.8?'#fff6c8':'#d8ddff'))}}

/* ---------- sprites ---------- */
const BODY_SHORT=["..HHHH..",".HHHHHH.",".HSSSSH.",".SKSSKS.",".SSSSSS.","..SSSS..",".CCCCCC.","SCCCCCCS"];
const BODY_LONG =["..HHHH..",".HHHHHH.",".HSSSSH.","HSKSSKSH","HSSSSSSH","H.SSSS.H","HCCCCCCH","SCCCCCCS"];
const LEGS=[["..PPPP..","..P..P..","..P..P..",".BB..BB."],["..PPPP..",".P....P.",".P....P.","BB....BB"]];
const PCOL={H:'#1b1626',S:'#f6d2b0',K:'#1b1626',C:'#e86a5c',P:'#2f3c7a',B:'#2a2230'};
const DOG=[".YYYY...","EYKYYE..","NYYYYE..",".YYYY...","..YYYYYY","..YYYYY.","..Y.Y.Y."];
const DCOL={Y:'#e7b46a',E:'#a3652d',K:'#1e1828',N:'#1e1828'};
function sprite(rows,x,y,cols,map){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){let k=r[i];if(k==='.')continue;if(map)k=map(k,i,j);rect(x+i,y+j,1,1,cols[k])}})}
function drawPlayer(x,frame,hair){const rows=(hair==='long'?BODY_LONG:BODY_SHORT).concat(LEGS[frame]);
  rect(x+1,FEET,6,1,'rgba(0,0,0,.35)');sprite(rows,x,FEET-12,PCOL)}
function drawDog(x,t){const blink=Math.floor(t/120)%28===0;const wag=Math.floor(t/220)%2;
  const y=FEET-7;rect(x,FEET,8,1,'rgba(0,0,0,.35)');
  rect(x+1,y-2,4,2,'#1c2a6a');rect(x,y-1,6,1,'#1c2a6a');rect(x+1,y-1,4,1,'#f2c14e');
  sprite(DOG,x,y,DCOL,(k)=>(k==='K'&&blink)?'Y':k);
  rect(x+3,y+4,1,1,'#e86a5c');
  if(wag){rect(x+8,y+2,1,1,DCOL.Y);rect(x+8,y+3,1,1,DCOL.Y)}else{rect(x+8,y+3,1,1,DCOL.Y);rect(x+8,y+4,1,1,DCOL.Y)}}

/* ---------- scenes ---------- */
const S={};
S.station=t=>{
  sky(['#05071a','#080c24','#0c112e','#101739','#141c45'],0,92);stars(t,45,56);
  circ(132,18,7,'#f6efc9');circ(129,16,2,'#e4dbae');circ(134,21,1,'#e4dbae');
  [[0,22],[18,30],[40,18],[118,26],[140,34]].forEach(([x,h])=>rect(x,92-h-20,22,h,'#0a0e27'));
  rect(4,54,124,3,'#3e4d92');rect(4,57,124,32,'#27336c');rect(4,76,124,2,'#e86a5c');rect(4,86,124,4,'#151d45');
  for(let i=0;i<6;i++){const x=10+i*20;rect(x,61,13,11,'#ffd98a');rect(x,61,13,2,'#fff1c4');rect(x+6,61,1,11,'#e0b45e')}
  for(let i=0;i<5;i++)circ(18+i*24,90,3,'#0a0c1c');
  rect(0,92,W,28,'#33364c');rect(0,93,W,1,'#4a4e6c');for(let x=0;x<W;x+=8)rect(x,92,4,1,'#f2c14e');
  rect(0,112,W,1,'#2b2e42');
  ctx.globalAlpha=.18+.04*Math.sin(t/300);circ(147,53,12,'#ffd98a');ctx.globalAlpha=1;
  rect(146,50,2,42,'#1c2033');rect(142,47,10,4,'#1c2033');rect(144,51,6,2,'#fff1c4');
};
S.alley=t=>{
  sky(['#3a2f6b','#6d4482','#b35a7e','#e3806c','#f9b582'],0,92);
  circ(80,70,13,'#ffe6a0');
  for(let x=0;x<W;x++){const y=Math.round(18+((x-80)*(x-80))/420);rect(x,y,1,1,'#2e2248')}
  [{x:0,w:30,h:42,c:'#4e3554',r:'#36243f'},{x:30,w:26,h:30,c:'#5e3e5c',r:'#3e2a46'},{x:96,w:34,h:46,c:'#4a3352',r:'#32223c'},{x:130,w:30,h:34,c:'#583a5a',r:'#3a2642'}].forEach(b=>{
    rect(b.x,92-b.h,b.w,b.h,b.c);for(let k=0;k<6;k++)rect(b.x-2+k*2,92-b.h-1-k,b.w+4-k*4,1,b.r);
    rect(b.x+5,92-b.h+9,6,5,'#ffd98a');if(b.w>28)rect(b.x+b.w-11,92-b.h+9,6,5,'#ffd98a')});
  rect(0,92,W,28,'#a87c62');rect(0,92,W,2,'#c99a78');rect(0,108,W,1,'#956c54');
  rect(118,70,2,24,'#5e4234');rect(146,70,2,24,'#5e4234');rect(118,69,30,2,'#5e4234');
  const sw=Math.round(Math.sin(t/500)*2);rect(126,71,1,12,'#3a2a2a');rect(138,71,1,12,'#3a2a2a');rect(124+sw,83,16,2,'#e86a5c');
  circ(28,106,3,'#e86a5c');rect(27,104,2,1,'#ffb3a8');
  DUST.forEach(([a,b,c],i)=>{const x=(a*W+t*0.01*(c+.3))%W,y=(b*80+Math.sin(t/700+i)*3);rect(x,y,1,1,'#ffe9c4')});
};
S.classroom=t=>{
  rect(0,0,W,92,'#ddcdab');rect(0,0,W,6,'#c3ae89');rect(0,86,W,6,'#ae8f66');

function note(m,time,dur,type,vol){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(vol,time+.01);g.gain.exponentialRampToValueAtTime(.0001,time+dur);
  o.connect(g).connect(actx.destination);o.start(time);o.stop(time+dur+.02)}

  while(mus.next<actx.currentTime+.25){const n=tr.m[mus.step%tr.m.length];if(n)note(n,mus.next,tr.d*(tr.w?1.6:.9),tr.w||'square',tr.w?.06:.028);
    if(mus.step%8===0)note(tr.b[(mus.step/8|0)%tr.b.length],mus.next,tr.d*7.6,'triangle',.07);mus.next+=tr.d;mus.step++}},60);

const A={};
const fmt=s=>s.replace(/\{(\w+)\}/g,(_,k)=>A[k]||'');
let typing=false,skip=null,waitTap=null;
function typeText(who,text){return new Promise(res=>{
  $('name').hidden=!who;$('name').textContent=who||'';$('next').hidden=true;
  const full=fmt(text);let i=0,timer;typing=true;
  const finish=()=>{clearTimeout(timer);typing=false;skip=null;$('text').textContent=full;res()};
  skip=finish;
  const tick=()=>{i++;$('text').textContent=full.slice(0,i);if(i%2===0)blip();if(i>=full.length)return finish();timer=setTimeout(tick,34)};
  if(reduce)finish();else tick()})}
async function say(who,text){await typeText(who,text);$('next').hidden=false;await new Promise(r=>waitTap=r);$('next').hidden=true}
function advance(){if(typing&&skip)skip();else if(waitTap){const r=waitTap;waitTap=null;r()}}
$('dialog').addEventListener('click',advance);
$('dialog').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()}});
$('stage').addEventListener('click',advance);

async function choice(who,q,opts){await typeText(who,q);const box=$('choices');box.innerHTML='';
  return new Promise(res=>{opts.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.id='opt'+i;b.textContent=o.t;
    b.addEventListener('click',e=>{e.stopPropagation();box.hidden=true;blip();res(o)});box.appendChild(b)});
    box.hidden=false;box.scrollTop=0;if(matchMedia('(hover:hover)').matches)box.firstChild.focus({preventScroll:true})})}
async function ask(who,q,ph,max=30){await typeText(who,q);const inp=$('answer');inp.value='';inp.placeholder=ph;inp.maxLength=max;$('inputWin').hidden=false;
  setTimeout(()=>inp.focus(),50);
  return new Promise(res=>{const go=()=>{const v=inp.value.trim();$('inputWin').hidden=true;$('ok').onclick=null;inp.onkeydown=null;inp.blur();res(v)};
    $('ok').onclick=e=>{e.stopPropagation();go()};inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();go()}}})}

function wrapText(g,text,maxW){const words=text.split(' ');const lines=[];let cur='';
  const push=w=>{const t=cur?cur+' '+w:w;if(g.measureText(t).width<=maxW){cur=t;return}
    if(cur){lines.push(cur);cur=''}
    if(g.measureText(w).width<=maxW){cur=w;return}
    let part='';for(const ch of w){if(g.measureText(part+ch).width>maxW){lines.push(part);part=ch}else part+=ch}cur=part};
  words.forEach(push);if(cur)lines.push(cur);return lines}
